name: Update NSE Pre-Trade Data

on:
  schedule:
    # Runs every 15 minutes from 09:15 AM to 03:30 PM IST (03:45 to 10:00 UTC), Mon-Fri
    - cron: "45/15 3 * * 1-5"
    - cron: "*/15 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

env:
  TZ: Asia/Kolkata

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch_nse.py on GitHub Actions
        run: python fetch_nse.py

      - name: Commit and push nse_data.json if changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nse_data.json
          if git diff --staged --quiet; then
            echo "No changes to nse_data.json."
          else
            git commit -m "chore: update nse_data.json"
            git pull --rebase --autostash origin HEAD
            git push
          fi

      - name: Install Python dependencies and Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
